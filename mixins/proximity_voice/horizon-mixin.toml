[mod]
id = "proximity_voice"
version = "0.4.1"
priority = 100

# The Nightly it was made and tested on: the packet hook needs this commit's Game::handle_packet.
[compatibility]
horizon_revision = "fbd7288a1d0955ebd3a1c8450766eae610313e99"

# runtime.rs becomes the module crate::game::proximity_voice.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "proximity_voice"
source = "runtime.rs"

# The marks over heads, beside the name tags they go on: crate::proximity_marks of
# horizon-client-render.
[[module]]
id = "marks"
file = "crates/horizon-client-render/src/lib.rs"
name = "proximity_marks"
source = "marks.rs"
visibility = "pub"

# The protocol, the UDP link, Opus and the audio devices: a crate of its own, which
# horizon-client depends on.
[[crate]]
id = "engine"
path = "engine"

[[injection]]
id = "packet"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::handle_packet"
helper = "packet.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "packet", ty = "&horizon_protocol::packets::play::Clientbound", value = "&packet" },
]

[[injection]]
id = "chat"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::remote::Game<'_>::send_chat"
helper = "chat.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "message", ty = "&str", value = "message" },
]

[[injection]]
id = "tags"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::hud::HudBatch::name_tag"
helper = "tags.rs"
bindings = [
  { name = "batch", ty = "&mut HudBatch", value = "&mut *self" },
  { name = "atlas", ty = "&HudAtlas", value = "atlas" },
  { name = "text", ty = "&crate::text::Text", value = "text" },
  { name = "y", ty = "f32", value = "y" },
  { name = "color", ty = "u32", value = "color" },
  { name = "background", ty = "u32", value = "background" },
]

# The mod's settings screen, in the dialog screen's place.
[[injection]]
id = "screen_open"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::dialogs::Game<'_>::dialog_open"
